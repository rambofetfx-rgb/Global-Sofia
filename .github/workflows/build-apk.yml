name: Compilar APK Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gerar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2.2

      - name: Dar permissão ao Gradlew
        run: chmod +x gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Disponibilizar APK para Descarregar
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
