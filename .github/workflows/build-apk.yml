name: Compilar APK Android

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permissão ao Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Configurar Gradle (Cache Desativado)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true   # Ignora o cache antigo para evitar erros fantasmas

      - name: Limpeza Profunda e Compilação
        run: |
          echo "Iniciando limpeza e compilação..."
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --info
          else
            gradle clean assembleDebug --info
          fi

      - name: Disponibilizar APK para Descarregar
        uses: actions/upload-artifact@v4
        with:
          name: GlobalAnimes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
