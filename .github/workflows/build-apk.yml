name: Compilar APK Android

on:
  workflow_dispatch: # Gera o APK apenas quando você clicar em "Run workflow" manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Garantir AndroidX
        run: |
          # Habilita o AndroidX no gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          if [ -f "./gradlew" ]; then chmod +x gradlew; fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Compilar APK (Filtro para Mobile)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug > build_log.txt 2>&1 || FAILED=true
          else
            gradle clean assembleDebug > build_log.txt 2>&1 || FAILED=true
          fi
          
          if [ "$FAILED" = "true" ]; then
            echo "❌ FALHA NA COMPILAÇÃO. Resumo do Erro:"
            echo "----------------------------------------"
            grep -B 3 -A 15 "FAILED" build_log.txt || tail -n 25 build_log.txt
            echo "----------------------------------------"
            exit 1
          else
            echo "✅ Compilação concluída com sucesso!"
          fi

      - name: Disponibilizar APK para Descarregar
        uses: actions/upload-artifact@v4
        with:
          name: GlobalAnimes-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
