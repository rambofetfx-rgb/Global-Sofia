<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo GlobalAnimes</title>
    <style>
        body { 
            background-color: #121212; 
            color: #fff; 
            font-family: sans-serif; 
            text-align: center; 
            padding: 50px; 
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        button { 
            background-color: #e50914; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #b20710;
        }
    </style>
</head>
<body>

    <h1>Naruto - Episódio 1</h1>
    <p>Clique abaixo para extrair o link e testar o player nativo.</p>
    <button onclick="assistirEpisodio('naruto-episode-1')">Assistir no Player Nativo</button>

    <script>
        async function assistirEpisodio(episodioId) {
            try {
                // 1. Busca os dados do episódio na Consumet API (usando Gogoanime como provedor)
                const resposta = await fetch(`https://api.consumet.org/anime/gogoanime/watch/${episodioId}`);
                
                if (!resposta.ok) {
                    throw new Error('Falha na resposta da API');
                }
                
                const dados = await resposta.json();

                // 2. Procura a fonte de vídeo principal (.m3u8)
                const videoPrincipal = dados.sources.find(source => source.quality === 'auto' || source.quality === 'default');
                
                if (videoPrincipal && videoPrincipal.url) {
                    const linkM3U8 = videoPrincipal.url;
                    
                    // 3. Verifica se está dentro do Aplicativo Android e envia o link
                    if (window.AndroidApp) {
                        window.AndroidApp.abrirPlayerNativo(linkM3U8);
                    } else {
                        // Aviso caso você abra o HTML direto no navegador do computador/celular
                        alert("Você não está no aplicativo Android! Link extraído: " + linkM3U8);
                        console.log("Link M3U8:", linkM3U8);
                    }
                } else {
                    alert("Não foi possível encontrar o link do vídeo na qualidade automática.");
                }

            } catch (erro) {
                alert("Erro ao buscar dados na API. Tente novamente mais tarde.");
                console.error("Erro detalhado:", erro);
            }
        }
    </script>

</body>
</html>
