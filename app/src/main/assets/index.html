<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GlobalAnimes - Lançamentos em HD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0c0d10;
      --bg-card: #15171e;
      --bg-header: rgba(18, 20, 27, 0.85);
      --accent-color: #00b4d8;
      --accent-gradient: linear-gradient(135deg, #00b4d8 0%, #0077b6 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #222632;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Cabeçalho Sticky com Blur */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-live {
      background: rgba(0, 180, 216, 0.15);
      color: var(--accent-color);
      border: 1px solid rgba(0, 180, 216, 0.3);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Layout Principal */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--accent-gradient);
      border-radius: 2px;
    }

    /* Grid do Feeds de Episódios */
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
    }

    @media (min-width: 600px) {
      .anime-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .card:active {
      transform: scale(0.98);
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      background: #1c1f2b;
      overflow: hidden;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .ep-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(12, 13, 16, 0.85);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Carregamento e Mensagens */
    .status-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 180, 216, 0.2);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal do Reprodutor */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #14161d;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 100%;
      max-width: 860px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 12px 16px;
      background: #1b1e28;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .server-btn {
      background: #242836;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .server-btn.active {
      background: var(--accent-gradient);
      color: #fff;
      border-color: transparent;
    }

    .close-btn {
      background: #2b1a1d;
      color: #ff4d4d;
      border: 1px solid rgba(255, 77, 77, 0.3);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      margin-left: 4px;
    }

    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho GlobalAnimes -->
  <header>
    <div class="brand">
      Global<span>Animes</span>
    </div>
    <div class="badge-live">Lançamentos</div>
  </header>

  <!-- Feed de Episódios -->
  <main class="container">
    <div class="section-header">
      <h2 class="section-title">Episódios Recentes</h2>
    </div>

    <div id="anime-feed" class="anime-grid">
      <div class="status-container">
        <div class="spinner"></div>
        <p>A carregar episódios...</p>
      </div>
    </div>
  </main>

  <!-- Modal do Reprodutor -->
  <div id="player-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title" class="modal-title">A carregar...</h3>
        <div class="modal-controls">
          <button class="server-btn active" onclick="switchServer(1)">Servidor 1</button>
          <button class="server-btn" onclick="switchServer(2)">Servidor 2</button>
          <button class="server-btn" onclick="switchServer(3)">Servidor 3</button>
          <button class="close-btn" onclick="closePlayer()">Fechar</button>
        </div>
      </div>
      <div id="player-box" class="player-container"></div>
    </div>
  </div>

  <script>
    let currentAnime = null;

    // Busca os lançamentos recentes na AniList
    async function fetchReleases() {
      const container = document.getElementById('anime-feed');

      const query = `
        query {
          Page(page: 1, perPage: 30) {
            media(status: RELEASING, type: ANIME, sort: TRENDING_DESC) {
              id
              idMal
              title {
                romaji
                english
              }
              coverImage {
                large
              }
              episodes
              nextAiringEpisode {
                episode
              }
            }
          }
        }
      `;

      try {
        const response = await fetch('https://graphql.anilist.co', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
          },
          body: JSON.stringify({ query })
        });

        if (!response.ok) throw new Error(`Status: ${response.status}`);

        const result = await response.json();
        const items = result.data.Page.media;

        container.innerHTML = '';

        if (!items || items.length === 0) {
          container.innerHTML = '<div class="status-container">Nenhum lançamento encontrado.</div>';
          return;
        }

        items.forEach(anime => {
          const title = anime.title.romaji || anime.title.english;
          const latestEp = anime.nextAiringEpisode 
            ? (anime.nextAiringEpisode.episode > 1 ? anime.nextAiringEpisode.episode - 1 : 1)
            : (anime.episodes || 1);

          const card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => openPlayer(anime.id, anime.idMal, title, latestEp);

          card.innerHTML = `
            <div class="poster-wrapper">
              <img src="${anime.coverImage.large}" alt="${title}" loading="lazy">
              <span class="ep-tag">EP ${latestEp}</span>
            </div>
            <div class="card-info">
              <h3 class="card-title">${title}</h3>
            </div>
          `;
          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="status-container">Erro ao carregar os lançamentos. Verifique a sua ligação.</div>`;
      }
    }

    // Abre o modal de reprodução
    function openPlayer(anilistId, malId, title, episode) {
      currentAnime = { anilistId, malId, title, episode };

      const modal = document.getElementById('player-modal');
      const modalTitle = document.getElementById('modal-title');

      modalTitle.innerText = `${title} - Episódio ${episode}`;
      modal.classList.add('active');

      switchServer(1);
    }

    // Alterna os servidores de vídeo sem restrições de sandbox
    function switchServer(serverNum) {
      if (!currentAnime) return;

      const playerBox = document.getElementById('player-box');
      const btns = document.querySelectorAll('.server-btn');
      btns.forEach((btn, idx) => btn.classList.toggle('active', idx === serverNum - 1));

      const { anilistId, malId, episode } = currentAnime;
      let embedUrl = '';

      if (serverNum === 1) {
        embedUrl = `https://vidsrc.cc/v2/embed/anime/${anilistId}/${episode}`;
      } else if (serverNum === 2) {
        embedUrl = `https://vidsrc.me/embed/anime?anilist=${anilistId}&episode=${episode}`;
      } else if (serverNum === 3) {
        const targetId = malId || anilistId;
        embedUrl = `https://player.autoembed.cc/embed/anime/${targetId}/${episode}`;
      }

      // Iframe limpo para o APK interceptar redirects via WebViewClient
      playerBox.innerHTML = `
        <iframe 
          src="${embedUrl}" 
          referrerpolicy="no-referrer"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
          scrolling="no">
        </iframe>
      `;
    }

    // Fecha o modal e para a reprodução do áudio
    function closePlayer() {
      const modal = document.getElementById('player-modal');
      const playerBox = document.getElementById('player-box');

      currentAnime = null;
      playerBox.innerHTML = '';
      modal.classList.remove('active');
    }

    fetchReleases();
  </script>

</body>
</html>
